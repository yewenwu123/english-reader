<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>双语翻转阅读器</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">Bilingual Flip Reader</p>
        <h1>双语翻转阅读器</h1>
        <p class="subtitle">粘贴英文或中文文本，点击词语翻转查看 Google 在线翻译。</p>
      </div>
      <span id="netStatus" class="net-status online">Google 在线翻译</span>
    </header>

    <section class="workspace">
      <div class="panel input-area">
        <div class="toolbar">
          <div class="mode-switch" aria-label="翻译方向">
            <button class="mode-btn active" data-mode="en-zh" type="button">英文到中文</button>
            <button class="mode-btn" data-mode="zh-en" type="button">中文到英文</button>
          </div>
          <div class="style-switch" aria-label="排版风格">
            <button class="style-btn active" data-style="classic" type="button">经典</button>
            <button class="style-btn" data-style="focus" type="button">专注</button>
            <button class="style-btn" data-style="tiles" type="button">卡片</button>
          </div>
        </div>

        <textarea id="textInput" placeholder="在此粘贴英文文本，点击排版后翻转查看中文释义。" spellcheck="false"></textarea>

        <div class="input-actions">
          <button id="formatBtn" class="btn btn-primary" type="button">排版</button>
          <button id="clearBtn" class="btn btn-secondary" type="button">清空</button>
        </div>
      </div>

      <section id="output" class="output classic" aria-live="polite">
        <div class="empty-hint">输入文本后点击“排版”</div>
      </section>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
